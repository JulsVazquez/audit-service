server:
  port: 8081

spring:
  application:
    name: audit-service
  config:
    import: "optional:configserver:http://localhost:8888"

  datasource:
    url: jdbc:mariadb://localhost:3307/audit_db
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect